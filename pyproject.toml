[project]
name = "serenity-denver"
version = "0.2.0"
description = "Serenity Discord community bot"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".work", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"serenity/legacy/*" = ["E", "F", "I"]
