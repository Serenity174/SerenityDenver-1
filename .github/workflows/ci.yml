name: Checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: serenity_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: serenity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U serenity_test -d serenity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://serenity_test:test-only-password@localhost:5432/serenity_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check serenity tests main.py
      - run: ruff format --check serenity tests main.py
      - run: python -m unittest discover -s tests -v
